// Applied by the tracked Expo plugin. Never use the template's debug-key fallback.
def uploadEnvironment = [
    store: System.getenv('TMV_UPLOAD_STORE_FILE'),
    alias: System.getenv('TMV_UPLOAD_KEY_ALIAS'),
    storePassword: System.getenv('TMV_UPLOAD_STORE_PASSWORD'),
    keyPassword: System.getenv('TMV_UPLOAD_KEY_PASSWORD')
]
def unsignedRelease = providers.gradleProperty('tmvUnsignedRelease').orNull == 'true'
def hasUploadSigning = uploadEnvironment.values().every { it != null && !it.trim().isEmpty() }
def partialUploadSigning = uploadEnvironment.values().any { it != null && !it.isEmpty() } && !hasUploadSigning

android.buildTypes.release.signingConfig = null
if (hasUploadSigning && !unsignedRelease) {
    android.signingConfigs.create('upload') {
        storeFile new File(uploadEnvironment.store)
        storePassword uploadEnvironment.storePassword
        keyAlias uploadEnvironment.alias
        keyPassword uploadEnvironment.keyPassword
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.upload
}

gradle.taskGraph.whenReady { graph ->
    def packagesRelease = graph.allTasks.any {
        it.project == project && it.name in ['bundleRelease', 'assembleRelease', 'packageRelease', 'packageReleaseBundle', 'signReleaseBundle']
    }
    if (packagesRelease) {
        if (partialUploadSigning || (unsignedRelease && hasUploadSigning)) {
            throw new GradleException('Use complete TMV_UPLOAD_* signing settings OR explicit unsigned verification, not a partial/mixed configuration.')
        }
        if (!hasUploadSigning && !unsignedRelease) {
            throw new GradleException('Production upload signing is required. Configure TMV_UPLOAD_* locally; for a NON-UPLOADABLE verification artifact explicitly set -PtmvUnsignedRelease=true. See docs/release-hardening.md.')
        }
        if (hasUploadSigning) {
            // Check credentials before compilation, without printing paths, aliases or provider errors.
            def storePasswordChars = uploadEnvironment.storePassword.toCharArray()
            def keyPasswordChars = uploadEnvironment.keyPassword.toCharArray()
            try {
                def store = new File(uploadEnvironment.store)
                if (!store.isAbsolute() || !store.isFile()) throw new IllegalArgumentException()
                def keystore = java.security.KeyStore.getInstance(store, storePasswordChars)
                def key = keystore.getKey(uploadEnvironment.alias, keyPasswordChars)
                def certificate = keystore.getCertificate(uploadEnvironment.alias)
                if (!(key instanceof java.security.PrivateKey) ||
                    !(certificate instanceof java.security.cert.X509Certificate)) throw new IllegalArgumentException()
                certificate.checkValidity()
                if (certificate.subjectX500Principal.name.toLowerCase(java.util.Locale.ROOT).contains('cn=android debug')) {
                    throw new IllegalArgumentException()
                }
                if (!(certificate.publicKey instanceof java.security.interfaces.RSAPublicKey) ||
                    certificate.publicKey.modulus.bitLength() < 2048) throw new IllegalArgumentException()
            } catch (Exception ignored) {
                throw new GradleException('Upload signing validation failed. Check the absolute keystore path, alias, both passwords and a valid non-debug RSA certificate (at least 2048 bits). Values are withheld; no debug fallback is permitted.')
            } finally {
                java.util.Arrays.fill(storePasswordChars, (char) 0)
                java.util.Arrays.fill(keyPasswordChars, (char) 0)
            }
        }
        if (providers.gradleProperty('expo.devlauncher.configureInRelease').orNull == 'true') {
            throw new GradleException('The development launcher must not be enabled in release builds.')
        }
    }
}

// Bound bundler memory on the documented Windows host; does not alter the bundle.
extensions.getByName('react').extraPackagerArgs.set(['--max-workers', '2'])
