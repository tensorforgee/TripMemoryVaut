# Keep generated Android Prefab/CMake paths within Windows native tool limits.
virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 32

# Pin auto-installed native peers to the selected Expo/RN compatibility matrix.
overrides:
  react-native-gesture-handler: 2.32.0
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  '@react-native/metro-config': 0.86.3
  react-dom: 19.2.3
